[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vd-exp-bench"
version = "0.1.0"
description = "Reproducible Milvus range-query benchmark harness for EXP-001/EXP-002"
requires-python = ">=3.11"
dependencies = [
  "cryptography==49.0.0",
  "numpy==2.5.1",
  "pymilvus==3.0.1",
]

[project.scripts]
vd-exp-bench = "vdbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
