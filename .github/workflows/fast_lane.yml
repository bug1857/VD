name: Fast Lane

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
        pip install -e .
        
    - name: Run Ruff
      run: ruff check src tests
      
    - name: Run Mypy
      run: mypy src tests
      
    - name: Run fast tests
      run: |
        # In a real fast lane, we'd only run tests without the slow benchmarks.
        # But for now we run the policy and utility unit tests.
        PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest discover -s tests -p "test_*.py"
